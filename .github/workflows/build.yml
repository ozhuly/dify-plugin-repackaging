name: Batch Repackage Dify Plugins

on:
  workflow_dispatch:
    inputs:
      plugins_directory:
        description: "Directory containing .difypkg files (use . for repository root)"
        required: true
        default: "."
        type: string
      platform_arm:
        description: "Use ARM platform (true = manylinux_2_17_aarch64, false = manylinux_2_17_x86_64)"
        required: true
        default: "false"

jobs:
  repackage-batch:
    runs-on: ubuntu-latest
    steps:
      - name: Print workflow inputs
        run: |
          echo "plugins_directory = ${{ inputs.plugins_directory }}"
          echo "platform_arm      = ${{ inputs.platform_arm }}"

      - name: Resolve platform
        run: |
          if [ "${{ inputs.platform_arm }}" = "true" ]; then
            echo "PIP_PLATFORM=manylinux_2_17_aarch64" >> "$GITHUB_ENV"
            echo "PACKAGE_SUFFIX=offline-arm" >> "$GITHUB_ENV"
          else
            echo "PIP_PLATFORM=manylinux_2_28_x86_64" >> "$GITHUB_ENV"
            echo "PACKAGE_SUFFIX=offline" >> "$GITHUB_ENV"
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Make plugin_repackaging.sh executable
        run: chmod +x ./plugin_repackaging.sh

      - name: Run batch plugin repackaging script
        run: |
          PIP_MIRROR_URL=https://pypi.org/simple \
          ./plugin_repackaging.sh \
          -p ${{ env.PIP_PLATFORM }} \
          -s ${{ env.PACKAGE_SUFFIX }} \
          batch \
          "${{ inputs.plugins_directory }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          # Groups all output files into a single downloadable zip artifact
          name: offline-plugins-${{ env.PACKAGE_SUFFIX }}
          path: "**/*-${{ env.PACKAGE_SUFFIX }}.difypkg"
          retention-days: 7
